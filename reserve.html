<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>상상의 문 — 예약</title>

<link rel="stylesheet" href="css/fonts.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />

<style>
  :root { --navy:#0a0e1c; --gold:#f2d7ac; --gold-d:#c8a863; --cream:#ece4d6; --muted:#9aa2bd;
          --card:#10162e; --card-2:#0c1126; --line:rgba(200,168,99,.18); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--navy); color:var(--cream);
         font-family:'Paperozi',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; overflow-x:hidden; }
  img { display:block; -webkit-user-drag:none; user-select:none; }

  /* ── 헤더 (themes/story와 동일) ── */
  .topbar { position:sticky; top:0; z-index:100; height:78px; background:linear-gradient(180deg,#0c1124 0%,#080b18 100%);
            border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 clamp(20px,4vw,56px); }
  .topbar .brand { display:flex; align-items:center; flex:none; }
  .topbar .brand img { height:40px; width:auto; }
  .topbar nav { flex:1; display:flex; align-items:center; justify-content:center; gap:38px; }
  .topbar nav a { color:#d9d2c4; text-decoration:none; font-size:16px; font-weight:600; letter-spacing:1.5px; white-space:nowrap; transition:color .2s ease; }
  .topbar nav a:hover, .topbar nav a.active { color:var(--gold); }
  .topbar .qbtn { flex:none; display:inline-flex; align-items:center; gap:10px; height:44px; padding:0 22px;
                  border:1px solid rgba(200,168,99,.55); border-radius:6px; color:var(--gold); text-decoration:none;
                  font-size:15px; font-weight:600; letter-spacing:1px; transition:background .2s,border-color .2s; }
  .topbar .qbtn:hover { background:rgba(200,168,99,.12); border-color:var(--gold); }
  .topbar .qbtn span { font-size:18px; }
  @media (max-width:860px){ .topbar{ height:64px; padding:0 16px; } .topbar nav{ gap:18px; } .topbar nav a{ font-size:14px; letter-spacing:.05em; } .topbar .qbtn{ display:none; } }

  /* ── 배경 ── */
  .resv { position:relative; background:var(--navy) url('img/sub_bgi.png') top center / 100% auto no-repeat; padding-bottom:clamp(80px,10vw,140px); }
  .wrap { max-width:1240px; margin:0 auto; padding:0 clamp(20px,4vw,48px); }

  /* ── RESERVATION 히어로 ── */
  .resv-head { padding:clamp(56px,8vw,110px) 0 clamp(36px,5vw,64px); max-width:600px; }
  .resv-head .en { font-family:"Cormorant Garamond",serif; font-size:clamp(42px,6vw,72px); font-weight:600; letter-spacing:.13em; line-height:1; color:var(--gold); }
  .resv-head .kr { margin-top:clamp(20px,3vw,32px); font-size:clamp(20px,2.4vw,29px); font-weight:700; color:#f4eede; }
  .resv-head .desc { margin-top:14px; font-size:clamp(14px,1.5vw,16px); line-height:1.85; color:var(--muted); }

  /* ── 지점 선택 바 ── */
  .branch-bar { display:flex; flex-wrap:wrap; align-items:center; gap:20px 28px;
                background:rgba(12,17,38,.72); border:1px solid var(--line); border-radius:10px;
                padding:clamp(20px,2.5vw,30px) clamp(22px,3vw,38px); margin-bottom:clamp(28px,4vw,44px); }
  .branch-bar .pick { display:flex; align-items:center; gap:18px; flex:1 1 320px; }
  .branch-bar .pick > label { font-size:16px; font-weight:700; color:#e9e1cf; white-space:nowrap; }
  .selectbox { position:relative; flex:1; max-width:300px; }
  .selectbox::before { content:"📍"; position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:15px; opacity:.9; pointer-events:none; }
  .selectbox::after { content:""; position:absolute; right:18px; top:50%; width:9px; height:9px; border-right:2px solid var(--gold-d); border-bottom:2px solid var(--gold-d); transform:translateY(-65%) rotate(45deg); pointer-events:none; }
  .selectbox select { width:100%; appearance:none; -webkit-appearance:none; background:rgba(10,14,28,.85);
                      border:1px solid rgba(200,168,99,.35); border-radius:8px; color:var(--gold);
                      font-family:inherit; font-size:17px; font-weight:700; padding:14px 40px 14px 42px; cursor:pointer; }
  .selectbox select:focus { outline:none; border-color:var(--gold); }
  .branch-bar .meta { display:flex; gap:34px; }
  .branch-bar .meta .col { border-left:1px solid var(--line); padding-left:24px; }
  .branch-bar .meta .lab { font-size:13px; color:var(--gold-d); margin-bottom:7px; letter-spacing:.03em; }
  .branch-bar .meta .val { font-size:14px; color:#cdd3e4; line-height:1.5; max-width:230px; }
  @media (max-width:760px){ .branch-bar .meta{ width:100%; } .branch-bar .meta .col{ border-left:0; padding-left:0; } }

  /* ── 본문 2단 ── */
  .resv-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.22fr); gap:clamp(20px,2.5vw,32px); align-items:start; }
  @media (max-width:880px){ .resv-grid{ grid-template-columns:1fr; } }

  /* 좌: 테마 리스트 */
  .tlist { display:flex; flex-direction:column; gap:18px; }
  .titem { display:grid; grid-template-columns:96px 1fr auto; gap:18px; align-items:center;
           background:var(--card); border:1px solid rgba(255,255,255,.06); border-radius:10px;
           padding:18px; cursor:pointer; transition:border-color .2s, background .2s, transform .2s; }
  .titem:hover { transform:translateY(-2px); border-color:rgba(200,168,99,.4); }
  .titem.active { border-color:var(--gold); background:#141a33; }
  .titem .thumb { width:96px; aspect-ratio:3/4; border-radius:6px; overflow:hidden; border:1px solid rgba(200,168,99,.3); }
  .titem .thumb img { width:100%; height:100%; object-fit:cover; }
  .titem .ti-genre { font-size:12px; color:var(--gold-d); margin-bottom:5px; }
  .titem .ti-name { font-size:19px; font-weight:700; color:#f4eede; margin-bottom:9px; }
  .titem .ti-line { font-size:13px; color:var(--muted); margin-bottom:3px; }
  .titem .ti-line .stars { color:var(--gold); letter-spacing:1px; }
  .titem .ti-desc { margin-top:8px; font-size:12.5px; line-height:1.6; color:#b7bdcf;
                    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  .titem .book { align-self:center; display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
                 padding:11px 18px; border-radius:7px; font-weight:700; font-size:14px;
                 border:1px solid rgba(200,168,99,.5); color:var(--gold); background:transparent; transition:background .2s,border-color .2s; }
  .titem.active .book, .titem .book:hover { background:var(--gold); color:#0a0e1c; border-color:var(--gold); }
  @media (max-width:520px){ .titem{ grid-template-columns:80px 1fr; } .titem .book{ grid-column:1/-1; justify-content:center; } .titem .thumb{ width:80px; } }

  /* 우: 상세 + 예약 */
  .detail { background:var(--card); border:1px solid rgba(255,255,255,.06); border-radius:10px; padding:clamp(22px,3vw,34px); }
  .detail .d-genre { font-size:13px; color:var(--gold-d); margin-bottom:6px; }
  .detail .d-name { font-size:clamp(22px,2.6vw,28px); font-weight:700; color:#f4eede; margin-bottom:22px; }
  .detail .d-top { display:grid; grid-template-columns:200px 1fr; gap:26px; }
  @media (max-width:520px){ .detail .d-top{ grid-template-columns:1fr; } }
  .detail .d-poster { width:100%; aspect-ratio:3/4; border-radius:8px; overflow:hidden; border:2px solid rgba(200,168,99,.4); box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .detail .d-poster img { width:100%; height:100%; object-fit:cover; }
  .detail .d-info { align-self:start; }
  .detail .d-info .row { display:flex; justify-content:space-between; gap:16px; padding:9px 0; font-size:14.5px; border-bottom:1px solid rgba(255,255,255,.05); }
  .detail .d-info .row:last-of-type { border-bottom:0; }
  .detail .d-info .k { color:var(--muted); }
  .detail .d-info .v { color:#e8e2d3; font-weight:600; }
  .detail .d-info .v.stars { color:var(--gold); letter-spacing:1px; }
  .detail .d-desc { margin-top:18px; font-size:14px; line-height:1.7; color:#cfd3e0; white-space:pre-line; }

  .hr { height:1px; background:var(--line); margin:clamp(24px,3vw,34px) 0; }
  .step-h { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .step-h .num { font-family:"Cormorant Garamond",serif; font-size:16px; font-weight:700; color:var(--gold-d); }
  .step-h .t { font-size:16px; font-weight:700; color:#f0e8d6; }

  /* 달력 */
  .cal { background:var(--card-2); border:1px solid rgba(255,255,255,.06); border-radius:10px; padding:18px clamp(14px,2vw,22px); }
  .cal-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-top .my { font-size:17px; font-weight:700; color:#f0e8d6; letter-spacing:.04em; }
  .cal-nav { width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--gold);
             cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:background .2s; }
  .cal-nav:hover { background:rgba(200,168,99,.12); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-dow { font-size:12.5px; color:var(--muted); padding:6px 0 10px; }
  .cal-dow:first-child { color:#d98c8c; } /* 일 */
  .cal-dow:last-child { color:#8ca6d9; }  /* 토 */
  .cal-cell { aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:14px; color:#d5d9e6;
              border-radius:50%; cursor:pointer; transition:background .15s, color .15s; }
  .cal-cell.out { color:#3c425a; cursor:default; }
  .cal-cell.past { color:#454b63; cursor:not-allowed; }
  .cal-cell.sun { color:#d98c8c; }
  .cal-cell.sat { color:#8ca6d9; }
  .cal-cell.today { box-shadow:inset 0 0 0 1px var(--gold-d); }
  .cal-cell.sel { background:var(--gold); color:#0a0e1c; font-weight:700; box-shadow:none; }
  .cal-cell:not(.out):not(.past):hover { background:rgba(200,168,99,.18); }

  /* 시간 */
  .times { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  @media (max-width:520px){ .times{ grid-template-columns:repeat(3,1fr); } }
  .slot { padding:12px 6px; text-align:center; font-size:14px; font-weight:600; color:#dfe3ef;
          background:var(--card-2); border:1px solid rgba(255,255,255,.07); border-radius:7px; cursor:pointer; transition:all .15s; }
  .slot:hover { border-color:rgba(200,168,99,.5); }
  .slot.sel { background:var(--gold); color:#0a0e1c; border-color:var(--gold); }
  .note { margin-top:12px; font-size:12px; color:#7c84a0; }

  /* 인원 */
  .counter { display:inline-flex; align-items:center; gap:0; border:1px solid rgba(255,255,255,.12); border-radius:8px; overflow:hidden; }
  .counter button { width:46px; height:46px; background:var(--card-2); border:0; color:var(--gold); font-size:20px; cursor:pointer; transition:background .15s; }
  .counter button:hover { background:rgba(200,168,99,.14); }
  .counter button:disabled { color:#454b63; cursor:not-allowed; }
  .counter .cnt { min-width:84px; text-align:center; font-size:16px; font-weight:700; color:#f0e8d6; }
  .count-note { margin-top:10px; font-size:13px; color:var(--muted); }

  /* 진행 버튼 */
  .submit { margin-top:clamp(26px,3.5vw,40px); width:100%; display:inline-flex; align-items:center; justify-content:center; gap:10px;
            padding:18px; border:0; border-radius:8px; background:var(--gold); color:#0a0e1c; font-family:inherit;
            font-size:17px; font-weight:700; cursor:pointer; transition:filter .2s; }
  .submit:hover { filter:brightness(1.06); }
  .submit span { font-size:19px; }
  .result { margin-top:16px; padding:16px 18px; border-radius:8px; font-size:14px; line-height:1.6; display:none; }
  .result.ok  { display:block; background:rgba(200,168,99,.12); border:1px solid rgba(200,168,99,.4); color:#f0e8d6; }
  .result.err { display:block; background:rgba(217,140,140,.12); border:1px solid rgba(217,140,140,.4); color:#f0d6d6; }
  .result b { color:var(--gold); }

  /* 푸터 */
  .footer { background:#0a0f24; color:#6f7794; text-align:center; padding:26px 20px; font-size:12px; border-top:1px solid rgba(255,255,255,.08); }
</style>
</head>
<body>

  <!-- 헤더 -->
  <header class="topbar">
    <a class="brand" href="index.html"><img src="img/main/logo.png" alt="상상의문 ESCAPE ROOM" /></a>
    <nav>
      <a href="story.html">상상의 문</a>
      <a href="themes.html">테마</a>
      <a href="reserve.html" class="active">예약</a>
      <a href="location.html">매장안내</a>
      <a href="#">공지</a>
    </nav>
    <a class="qbtn" href="#">예약 확인 <span>→</span></a>
  </header>

  <section class="resv">
    <div class="wrap">

      <!-- RESERVATION 히어로 -->
      <div class="resv-head">
        <h1 class="en">RESERVATION</h1>
        <p class="kr">상상의 문을 열 준비가 되셨나요?</p>
        <p class="desc">당신을 기다리는 공간 속으로<br>지금, 가장 특별한 이야기를 예약해보세요.</p>
      </div>

      <!-- 지점 선택 바 -->
      <div class="branch-bar">
        <div class="pick">
          <label for="branchSel">지점 선택</label>
          <div class="selectbox">
            <select id="branchSel"></select>
          </div>
        </div>
        <div class="meta">
          <div class="col">
            <div class="lab">지점 정보</div>
            <div class="val" id="bInfo">—</div>
          </div>
          <div class="col">
            <div class="lab">운영 시간</div>
            <div class="val" id="bHours">—</div>
          </div>
        </div>
      </div>

      <!-- 본문 2단 -->
      <div class="resv-grid">
        <!-- 좌: 테마 리스트 -->
        <div class="tlist" id="tlist"></div>

        <!-- 우: 상세 + 예약 -->
        <div class="detail">
          <p class="d-genre" id="dGenre">—</p>
          <h2 class="d-name" id="dName">테마를 선택하세요</h2>

          <div class="d-top">
            <div class="d-poster"><img id="dPoster" src="" alt="" /></div>
            <div class="d-info" id="dInfo"></div>
          </div>
          <p class="d-desc" id="dDesc"></p>

          <div class="hr"></div>

          <!-- 01 날짜 -->
          <div class="step-h"><span class="num">01</span><span class="t">날짜 선택</span></div>
          <div class="cal">
            <div class="cal-top">
              <button class="cal-nav" id="calPrev" aria-label="이전 달">‹</button>
              <span class="my" id="calMY"></span>
              <button class="cal-nav" id="calNext" aria-label="다음 달">›</button>
            </div>
            <div class="cal-grid" id="calGrid"></div>
          </div>

          <!-- 02 시간 -->
          <div class="step-h" style="margin-top:28px"><span class="num">02</span><span class="t">시간 선택</span></div>
          <div class="times" id="times"></div>
          <p class="note">* 실제 잔여 좌석은 예약 시스템 연동 후 표시됩니다.</p>

          <!-- 03 인원 -->
          <div class="step-h" style="margin-top:28px"><span class="num">03</span><span class="t">인원 선택</span></div>
          <div class="counter">
            <button id="minus" aria-label="인원 감소">−</button>
            <span class="cnt" id="cnt">2명</span>
            <button id="plus" aria-label="인원 증가">+</button>
          </div>
          <p class="count-note" id="countNote">최소 2명 ~ 최대 4명</p>

          <button class="submit" id="submit">예약 진행하기 <span>→</span></button>
          <div class="result" id="result"></div>
        </div>
      </div>

    </div>
  </section>

  <footer class="footer">© 2025 상상의문 ESCAPE ROOM. All rights reserved.</footer>

  <script>
    const P = "img/main/poster/";
    // 공포도/활동성 → 텍스트 변환
    const fearTxt = f => f <= 1 ? "거의 없음" : f === 2 ? "낮음" : f === 3 ? "보통" : f === 4 ? "높음" : "매우 높음";
    const actTxt  = a => a <= 1 ? "낮음" : a === 2 ? "보통" : a === 3 ? "다소 높음" : a === 4 ? "높음" : "매우 높음";
    const stars = d => "★".repeat(d) + "☆".repeat(5 - d);
    const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

    // 공통 시간 슬롯 (디자인 샘플)
    const SLOTS = ["10:00","11:25","12:45","14:15","15:35","16:55","18:25","19:40","20:55","22:25"];

    // 지점 정보 (주소·운영시간) + 테마 (themes-detail.md 기준)
    const BR = {
      "대학로점": { info:"서울 종로구 창경궁로34길 18-5, 지하3층 · 02-765-7771", hours:"평일 12:00–23:00 · 주말·공휴일 10:00–23:00", themes:[
        { n:"경찰과 도둑", g:"추리", d:3, p:"2~4명", t:"60분", f:1, a:2, img:P+"4_a.jpg", desc:"EP.1 경찰이야기\nEP.2 도둑이야기 — 같은 공간, 두 개의 시점." },
        { n:"스포일러", g:"미스터리", d:5, p:"2~6명", t:"85분", f:2, a:5, img:P+"1_a.jpg", desc:"그들은 이미 알고 있었다. ※ 고소공포증 주의 · 초등학생 이용 불가" },
        { n:"나이트워크", g:"판타지", d:3, p:"2~6명", t:"100분", f:2, a:2, img:P+"10_a.jpg", desc:"어두운 밤 속으로 발걸음을 내딛었다. 그리고 한없이 걸었다.\n그 끝에서 한 목소리를 들었다." },
      ]},
      "분당서현점": { info:"경기 성남시 분당구 황새울로342번길 11 금호리빙스텔 지하1층 · 031-708-1777", hours:"평일 12:00–23:00 · 주말·공휴일 10:00–23:00", themes:[
        { n:"시크릿 왕국의 스캔들 (감독판)", g:"추리/잔혹동화", d:4, p:"2~6명", t:"90분", f:3, a:2, img:P+"7_a.jpg", desc:"시크릿 왕국의 프린스 왕자와 새 왕자비를 소개하는 연회를 개최합니다. 부디 참석하여 기쁜 날을 함께 맞이해 주시오." },
        { n:"HERE I AM", g:"생존/탐험", d:3, p:"2~6명", t:"70분", f:2, a:4, img:P+"6_a.jpg", desc:"으으... 나 살아있는건가? 목말라... 낯선 곳에서 눈을 뜬 당신, 살아남아 이곳을 빠져나가라." },

        { n:"직박구리 : 남친탐구생활", g:"코믹", d:3, p:"2~6명", t:"70분", f:1, a:2, img:P+"27_a.jpg", desc:"회사 일 때문에 잠시 외출한 남자친구. 과연 남자친구의 컴퓨터에도 '그것'이 있을까? 어라..? 이게 뭐야..!" },

        { n:"혼숨", g:"미스터리/스릴러", d:3, p:"2~6명", t:"70분", f:3, a:2, img:P+"28_a.jpg", desc:"'괴담 모음집' 동아리에 새로 가입한 우리들은, 폐가로 유명한 옥석 산장으로 신입 환영회를 가게 되었다." },

      "수원2호점": { info:"경기 수원시 팔달구 효원로249번길 46-18, 3층 · 010-9360-4148", hours:"평일 12:00–23:00 · 주말·공휴일 10:00–23:00", themes:[
        { n:"알케이드 빌리지", g:"아케이드", d:4, p:"2~6명", t:"80분", f:1, a:4, img:P+"39_a.jpg", desc:"세상에서 제일 한가한 마을 RCADE VILLAGE에 '우수마을 평가원이 한 시간 뒤 도착'이라는 소식이! 1시간 안에 정신 차릴 수 있을까?" },
        { n:"OKCUT", g:"코메디", d:4, p:"2~6명", t:"90분", f:1, a:2, img:P+"42_a.jpg", desc:"[Synopsis #3] 어느 한 저택을 수사하려는 주인공. (문이 닫히고 눈을 뜨며 시계를 본다) '주어진 시간이 얼마 없군.'" },
        { n:"성지기숙학원 : 특수교정반", g:"공포", d:4, p:"2~6명", t:"80분", f:5, a:2, img:P+"37_a.jpg", desc:"같은 기척, 같은 냄새, 같은 어둠. 나는 또다시 이 기숙학원에서 깨어났다." },
        { n:"춘화각 : 피할 수 없는 저주", g:"공포", d:3, p:"2~6명", t:"80분", f:4, a:2, img:P+"40_a.jpg", desc:"자네도 장원 급제를 위해서 이 춘화각을 찾았는가? 이쪽 끝방으로 들어가시게. ※ 직원 NPC와 함께 진행" },
        { n:"낙화 : 떨어지는 꽃", g:"스릴러", d:2, p:"2~6명", t:"80분", f:2, a:2, img:P+"38_a.jpg", desc:"수천 개의 플래시가 날 향하던 그 밤, 나는 꼭대기에 있었다. 어쩌면 끝은 이미 정해져 있었는지도 모른다." },
        { n:"HINDSIGHT", g:"잠입/드라마", d:3, p:"2~4명", t:"80분", f:1, a:3, img:P+"41_a.jpg", desc:"여보세요, 도희 맞지? 거의 2년 만이네. 그날 뒤로 해킹에서 손 뗀 건 알지만... 우리 오랜만에 일 하나만 같이 할까?" },
      ]},
    };

    // 상태
    const state = { branch:null, theme:0, count:2, slot:null,
                    cal:{ y:0, m:0, sel:null } };
    const today = new Date(); today.setHours(0,0,0,0);
    state.cal.y = today.getFullYear();
    state.cal.m = today.getMonth();

    function parseRange(p){ const m = p.match(/(\d+)\D+(\d+)/); return m ? [parseInt(m[1]),parseInt(m[2])] : [1,6]; }
    function curThemes(){ return BR[state.branch].themes; }
    function curTheme(){ return curThemes()[state.theme]; }

    /* 지점 드롭다운 */
    function initBranches(preBranch, preTheme){
      const sel = document.getElementById("branchSel");
      sel.innerHTML = Object.keys(BR).map(b=>`<option value="${b}">${b}</option>`).join("");
      state.branch = (preBranch && BR[preBranch]) ? preBranch : Object.keys(BR)[0];
      sel.value = state.branch;
      sel.addEventListener("change", ()=>{ state.branch = sel.value; state.theme = 0; refreshBranch(); });
      // 사전 선택 테마
      if (preTheme){ const i = curThemes().findIndex(t=>t.n===preTheme); if(i>=0) state.theme = i; }
      refreshBranch();
    }

    function refreshBranch(){
      document.getElementById("bInfo").textContent = BR[state.branch].info;
      document.getElementById("bHours").textContent = BR[state.branch].hours;
      renderList();
      selectTheme(state.theme);
    }

    /* 좌측 리스트 */
    function renderList(){
      const el = document.getElementById("tlist");
      el.innerHTML = curThemes().map((t,i)=>`
        <div class="titem ${i===state.theme?'active':''}" data-i="${i}">
          <div class="thumb"><img src="${t.img}" alt="${esc(t.n)}" loading="lazy"></div>
          <div class="ti-body">
            <div class="ti-genre">${esc(t.g)}</div>
            <div class="ti-name">${esc(t.n)}</div>
            <div class="ti-line">난이도 <span class="stars">${stars(t.d)}</span></div>
            <div class="ti-line">인원 ${t.p} &nbsp;|&nbsp; 시간 ${t.t}</div>
            <div class="ti-desc">${esc(t.desc)}</div>
          </div>
          <button class="book">예약하기 <span>→</span></button>
        </div>`).join("");
      el.querySelectorAll(".titem").forEach(c=>{
        c.addEventListener("click", ()=>selectTheme(parseInt(c.dataset.i)));
      });
    }

    /* 우측 상세 */
    function selectTheme(i){
      state.theme = i;
      document.querySelectorAll("#tlist .titem").forEach((c,idx)=>c.classList.toggle("active", idx===i));
      const t = curTheme();
      document.getElementById("dGenre").textContent = t.g;
      document.getElementById("dName").textContent = t.n;
      const poster = document.getElementById("dPoster");
      poster.src = t.img; poster.alt = t.n;
      document.getElementById("dInfo").innerHTML = `
        <div class="row"><span class="k">인원</span><span class="v">${t.p}</span></div>
        <div class="row"><span class="k">시간</span><span class="v">${t.t}</span></div>
        <div class="row"><span class="k">난이도</span><span class="v stars">${stars(t.d)}</span></div>
        <div class="row"><span class="k">공포</span><span class="v">${fearTxt(t.f)}</span></div>
        <div class="row"><span class="k">활동성</span><span class="v">${actTxt(t.a)}</span></div>`;
      document.getElementById("dDesc").textContent = t.desc;
      // 인원 초기화
      const [mn] = parseRange(t.p);
      state.count = mn;
      updateCount();
      renderTimes();
      hideResult();
    }

    /* 달력 */
    const MON = ["일","월","화","수","목","금","토"];
    function renderCal(){
      const {y,m} = state.cal;
      document.getElementById("calMY").textContent = `${y}.${String(m+1).padStart(2,"0")}`;
      const first = new Date(y,m,1).getDay();
      const dim = new Date(y,m+1,0).getDate();
      const prevDim = new Date(y,m,0).getDate();
      let html = MON.map((d,i)=>`<div class="cal-dow ${i===0?'':''}">${d}</div>`).join("");
      for(let i=0;i<42;i++){
        let day, cls="cal-cell", inMonth=true, dateObj=null;
        if(i<first){ day=prevDim-first+1+i; cls+=" out"; inMonth=false; }
        else if(i<first+dim){ day=i-first+1; }
        else { day=i-first-dim+1; cls+=" out"; inMonth=false; }
        const dow=i%7;
        if(inMonth){
          dateObj = new Date(y,m,day);
          if(dow===0) cls+=" sun"; if(dow===6) cls+=" sat";
          if(dateObj.getTime()===today.getTime()) cls+=" today";
          if(dateObj<today) cls+=" past";
          const s=state.cal.sel;
          if(s && s.y===y && s.m===m && s.d===day) cls+=" sel";
        }
        html += `<div class="${cls}" ${inMonth?`data-day="${day}"`:""}>${day}</div>`;
      }
      const g=document.getElementById("calGrid"); g.innerHTML=html;
      g.querySelectorAll(".cal-cell[data-day]").forEach(c=>{
        if(c.classList.contains("past")) return;
        c.addEventListener("click", ()=>{ state.cal.sel={y,m,d:parseInt(c.dataset.day)}; renderCal(); hideResult(); });
      });
    }
    document.getElementById("calPrev").addEventListener("click",()=>{ state.cal.m--; if(state.cal.m<0){state.cal.m=11;state.cal.y--;} renderCal(); });
    document.getElementById("calNext").addEventListener("click",()=>{ state.cal.m++; if(state.cal.m>11){state.cal.m=0;state.cal.y++;} renderCal(); });

    /* 시간 */
    function renderTimes(){
      const el=document.getElementById("times");
      el.innerHTML = SLOTS.map(s=>`<div class="slot" data-s="${s}">${s}</div>`).join("");
      state.slot=null;
      el.querySelectorAll(".slot").forEach(s=>s.addEventListener("click",()=>{
        el.querySelectorAll(".slot").forEach(x=>x.classList.remove("sel"));
        s.classList.add("sel"); state.slot=s.dataset.s; hideResult();
      }));
    }

    /* 인원 */
    function updateCount(){
      const [mn,mx]=parseRange(curTheme().p);
      state.count=Math.min(Math.max(state.count,mn),mx);
      document.getElementById("cnt").textContent=state.count+"명";
      document.getElementById("countNote").textContent=`최소 ${mn}명 ~ 최대 ${mx}명`;
      document.getElementById("minus").disabled = state.count<=mn;
      document.getElementById("plus").disabled = state.count>=mx;
    }
    document.getElementById("minus").addEventListener("click",()=>{ state.count--; updateCount(); hideResult(); });
    document.getElementById("plus").addEventListener("click",()=>{ state.count++; updateCount(); hideResult(); });

    /* 진행 */
    function hideResult(){ const r=document.getElementById("result"); r.className="result"; r.innerHTML=""; }
    document.getElementById("submit").addEventListener("click",()=>{
      const r=document.getElementById("result");
      if(!state.cal.sel){ r.className="result err"; r.textContent="날짜를 선택해주세요."; return; }
      if(!state.slot){ r.className="result err"; r.textContent="시간을 선택해주세요."; return; }
      const s=state.cal.sel;
      const dateStr=`${s.y}.${String(s.m+1).padStart(2,"0")}.${String(s.d).padStart(2,"0")}`;
      r.className="result ok";
      r.innerHTML=`예약 정보가 확인되었습니다 — <b>${state.branch}</b> · <b>${esc(curTheme().n)}</b><br>${dateStr} ${state.slot} · ${state.count}명<br><span style="color:#9aa2bd">※ 온라인 결제·확정은 예약 시스템 연동 후 제공됩니다.</span>`;
    });

    /* 초기화 (themes.html에서 넘어온 ?branch=&theme= 반영) */
    const q=new URLSearchParams(location.search);
    initBranches(q.get("branch"), q.get("theme"));
    renderCal();
  </script>
